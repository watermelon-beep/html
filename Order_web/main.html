<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Passero+One&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="sub-container">
            <div class="logo">
                <img src="logo-removebg-preview.png">
                <h1 class="brand">Hellicon</h1>
            </div>
            <div class="sign-in">
                <h1>Welcome Back</h1>
                <p>To keep connected with us please login with personal info</p>
                <button id="homeBtn" class="sign-in-but">SIGN IN</button>
            </div>
        </div>
    </div>
    <div class="sign-up">
        <h1 class="create">Create Account</h1>
        <div class="soc-med">
            <img src="fb.png" alt="">
            <img src="google.png" alt="">
            <img src="instagram.png" alt="">
        </div>
        <p>or use your email for registration</p>
        <div class="input-holder">
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
        </div>
        <button class="sign-up-but">
            SIGN UP
        </button>
    </div>

    <script src="main.js"></script>
</body>
</html>
